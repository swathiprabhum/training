<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Expense Tracker</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <!-- Track daily expenses.Users should be able to add, edit, delete expenses. Each expense has id, title, amount, category, and date. -->
    <h2>Smart Expense Tracker</h2>
    <div class="container">        
        <div id="data-input" class="input-group">
            <input type="text" id="expenseInput" placeholder="Enter Expense">
            <input type="number" id="amountInput" placeholder="Enter Amount">
            <input type="text" id="categoryInput" placeholder="Enter Category">
            <input type="date" id="dateInput" placeholder="Enter Date">

            <button id="addExpenseBtn" onclick="addExpense()">Add</button>
            <button id="saveExpenseBtn" onclick="saveExpenses()">Save</button>
            <input type ="text" id ="filterCategoryInput" placeholder="Filter by Category" oninput="displayCategoryWiseExpenses()">

        </div>
        <table border="1" >
        <thead>
            <tr>
                <th>ID </th>
                <th>Title</th>
                <th>Amount</th>
                <th>Category</th>
                <th>Date</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody id="expenseTable">
            <!-- Task rows will be added here dynamically -->
        </tbody>
    </table>
    <p>Total Expense: <b>Rs. <span id="totalExpense">0</span></b></p>
    </div>
    <script src="script.js"></script>
</body>
</html>
