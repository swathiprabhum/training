<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>Student / Employee Management System</title>
	<link rel="stylesheet" href="style.css">
</head>
<body>
	<main class="container">
		<h1>Student / Employee Management System</h1>

		<!-- Form to add / update records -->
		<section class="card">
			<h2 id="form-title">Add Record</h2>
			<form id="record-form">
				<input type="hidden" id="record-id">

				<label>Type
					<select id="type">
						<option value="Student">Student</option>
						<option value="Employee">Employee</option>
					</select>
				</label>

				<label>Name
					<input type="text" id="name" placeholder="Full name" required>
				</label>
				<label>Email
					<input type="email" id="email" placeholder="example@domain.com" required>
				</label>

				<label id="extra-label">Department / Class
					<input type="text" id="extra" placeholder="Department or Class">
				</label>

				<div class="form-actions">
					<button type="submit" id="save-btn">Save</button>
					<button type="button" id="reset-btn">Reset</button>
				</div>
			</form>
		</section>

		<!-- Table showing all records -->
		<section class="card">
			<h2>Records</h2>
			<table id="records-table">
				<thead>
					<tr>
						<th>ID</th>
						<th>Type</th>
						<th>Name</th>
						<th>Email</th>
						<th>Department/Class</th>
						<th>Actions</th>
					</tr>
				</thead>
				<tbody>
					<!-- Records will be populated here dynamically -->
				</tbody>
			</table>
		</section>
	</main>

	<script src="script.js"></script>
</body>
</html>
